# xmrts releases: build the CLI + the patched wallet sidecar per platform,
# bundle them with checksums, and attach to the GitHub release.
#
# Trigger: push a tag like v0.1.0.
# Platforms (v1): macOS arm64, Linux x86_64. Windows/macOS-Intel are TODOs:
# the depends triple + runner exist, they just haven't been exercised.
name: release

on:
  push:
    tags:
      - "v*"
  # Manual test runs (no tag move, no release, no tap bump): Actions tab
  # -> release -> Run workflow. Used to validate patch/script changes.
  workflow_dispatch:
    inputs:
      monero-tag:
        description: "Monero tag to build"
        default: "v0.18.5.0"

# Needed to attach assets to the release + attest build provenance.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Patched wallet sidecar. Linux builds natively; macOS cross-compiles
  # from Linux exactly the way upstream does (`aarch64-apple-darwin11`),
  # because Monero's depends toolchain assumes cross-compilation and its
  # native-mac path is broken by design (missing SDK wrappers).
  wallet:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            monero_host: ""
          - target: aarch64-apple-darwin11
            monero_host: aarch64-apple-darwin11
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: System deps (Linux)
        run: >
          sudo apt-get update &&
          sudo apt-get install -y build-essential cmake pkg-config
          autoconf automake libtool curl git python3 ccache gperf
          autotools-dev bsdmainutils unzip ca-certificates libtinfo5

      # The patch never touches dependencies, so a cached depends prefix
      # stays valid across releases (keyed by tag+platform). ccache covers
      # the Monero objects themselves. Together: first release is slow
      # (hours), subsequent ones rebuild only what changed (minutes).
      - name: Cache depends prefix
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/monero-build/contrib/depends/${{ matrix.target }}
          key: depends-${{ matrix.target }}-${{ inputs.monero-tag || 'v0.18.5.0' }}-${{ hashFiles('scripts/build-wallet-rpc.sh') }}

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.target }}-

      # Pinned Monero tag + xmrts patch -> static wallet binary.
      # Bump MONERO_TAG + PATCH together when moving to a new Monero release
      # (the patch is version-specific; see patches/).
      - name: Build patched monero-wallet-rpc (static)
        env:
          MONERO_TAG: ${{ inputs.monero-tag || 'v0.18.5.0' }}
          MONERO_PATCH: patches/monero-wallet-rpc-extra-v0.18.5.0.patch
          MONERO_HOST: ${{ matrix.monero_host }}
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          MODE=static ./scripts/build-wallet-rpc.sh \
            "$MONERO_TAG" "$MONERO_PATCH" "$RUNNER_TEMP/monero-build"
          cp "$RUNNER_TEMP/monero-build/build/release/bin/monero-wallet-rpc" .

      # Diagnostics for the Boost.Locale silent skip (darwin cross):
      # dumps b2's verbatim has_iconv check command + staged lib listing.
      - name: Dump Boost config log on failure
        if: failure()
        run: |
          find $RUNNER_TEMP/monero-build/contrib/depends/work/build \
            -path "*boost*" -name config.log | head -3 | \
            xargs grep -B3 -A30 -i "has_iconv" 2>/dev/null | head -90 || true
          find $RUNNER_TEMP/monero-build/contrib/depends/work/build \
            -path "*boost*" -name user-config.jam -exec cat {} \; | head -10 || true
          ls $RUNNER_TEMP/monero-build/contrib/depends/*/lib/ 2>/dev/null \
            | grep -i "boost.*locale\|boost.*filesystem" | head -10 || true

      - name: Upload wallet binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-${{ matrix.target }}
          path: monero-wallet-rpc

  # xmrts CLI (native Rust, fast) + bundling per platform.
  bundle:
    needs: wallet
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-linux-gnu
            archive: xmrts-linux-x86_64
          - runner: macos-14
            target: aarch64-apple-darwin11
            archive: xmrts-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Build xmrts (release)
        run: |
          cargo build --release
          cp target/release/xmrts .

      - name: Fetch wallet binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: wallet-${{ matrix.target }}
          path: .

      - name: Bundle + checksums
        run: |
          strip xmrts monero-wallet-rpc || true
          shasum -a 256 xmrts monero-wallet-rpc > SHA256SUMS
          cat SHA256SUMS
          mkdir -p dist
          tar -czf "dist/${{ matrix.archive }}.tar.gz" \
            xmrts monero-wallet-rpc SHA256SUMS
          (cd dist && shasum -a 256 "${{ matrix.archive }}.tar.gz" \
            > "TARBALL-SHA-${{ matrix.archive }}")

      - name: Upload tarball checksum (for tap bump)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tarball-sha-${{ matrix.archive }}
          path: dist/TARBALL-SHA-${{ matrix.archive }}

      - name: Attest tarball provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8b85266b0e65 # v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true

  # Keep the Homebrew tap in lockstep with the release: regenerate
  # Formula/xmrts.rb from the published tarball checksums and push.
  # Requires: an empty `homebrew-xmrts` repo + a fine-grained PAT with
  # contents:write on it, stored as the TAP_TOKEN secret here.
  bump-tap:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Collect tarball checksums
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tarball-sha-*
          merge-multiple: true
          path: tap-shas

      - name: Checkout tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/homebrew-xmrts
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Regenerate formula + push
        run: |
          args=(--formula tap/Formula/xmrts.rb)
          args+=(--owner "${{ github.repository_owner }}" --repo xmrts)
          args+=(--version "${GITHUB_REF_NAME#v}")
          for f in tap-shas/TARBALL-SHA-*; do
            archive="$(basename "$f" | sed 's/^TARBALL-SHA-//')"
            sha="$(cut -d' ' -f1 "$f")"
            args+=(--tarball "$archive=$sha")
          done
          mkdir -p tap/Formula
          python3 scripts/bump-tap-formula.py "${args[@]}"
          cd tap
          git config user.name "xmrts-release"
          git config user.email "xmrts-release@users.noreply.github.com"
          git add Formula/xmrts.rb
          git diff --cached --quiet && echo "formula unchanged" || {
            git commit -m "xmrts ${GITHUB_REF_NAME}"
            git push
          }
