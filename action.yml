name: "Timestamp with xmrts"
description: "Anchor file hashes on Monero for decentralized timestamping"
author: "xmrts"
branding:
  icon: "clock"
  color: "purple"

inputs:
  files:
    description: "Space-separated list of files (or globs) to timestamp"
    required: true
  version:
    description: "xmrts release to install (e.g. 0.3.0). Defaults to latest."
    required: false
    default: ""
  network:
    description: "Monero network for proofs: mainnet or stagenet"
    required: false
    default: "mainnet"
  daemon:
    description: "Daemon address for chain checks, e.g. http://127.0.0.1:18081"
    required: false
    default: ""
  wallet-endpoint:
    description: "Reachable monero-wallet-rpc endpoint with an open timestamping wallet, e.g. http://wallet:18082. A hosted runner has no local wallet; point at a reachable one (service container or remote). Empty means the saved/default endpoint."
    required: false
    default: ""
  wallet-username:
    description: "RPC username when the wallet uses --rpc-login (else empty)"
    required: false
    default: ""
  wallet-password:
    description: "RPC password when the wallet uses --rpc-login (store in secrets)"
    required: false
    default: ""
  max-fee:
    description: "Refuse to send when the quoted fee exceeds this many atomic units"
    required: false
    default: ""
  no-wait:
    description: "Write pending proofs now; finish later with finalize (true/false)"
    required: false
    default: "true"
  out-dir:
    description: "Folder for .xmrts proofs (default: next to each file)"
    required: false
    default: ""

outputs:
  txid:
    description: "Timestamp transaction hash (empty for offline runs)"
    value: ${{ steps.stamp.outputs.txid }}
  proofs:
    description: "Space-separated list of written .xmrts proof files"
    value: ${{ steps.stamp.outputs.proofs }}
  pending:
    description: "true when proofs are pending (not yet anchored)"
    value: ${{ steps.stamp.outputs.pending }}

runs:
  using: "composite"
  steps:
    - name: Install xmrts
      shell: bash
      env:
        XMTS_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -z "$XMTS_VERSION" ]; then
          url="$(curl -fsSL https://api.github.com/repos/${{ github.action_repository }}/releases/latest \
            | python3 -c 'import json,sys; print([a["browser_download_url"] for a in json.load(sys.stdin)["assets"] if "linux-x86_64" in a["name"]][0])')"
        else
          base="https://github.com/${{ github.action_repository }}/releases/download/v$XMTS_VERSION"
          url="$base/xmrts-linux-x86_64.tar.gz"
        fi
        curl -fsSL "$url" -o /tmp/xmrts.tar.gz
        # Authenticity: verify the build-provenance attestation before
        # executing anything. Fails closed when gh is present; warns when
        # gh is unavailable (e.g. non-GitHub runners).
        repo="${{ github.action_repository }}"
        owner="${repo%%/*}"
        if command -v gh >/dev/null 2>&1; then
          gh attestation verify /tmp/xmrts.tar.gz --owner "$owner"
        else
          echo "::warning::gh CLI missing: skipping attestation check for xmrts tarball"
        fi
        mkdir -p "$RUNNER_TOOL_CACHE/xmrts" && tar -xzf /tmp/xmrts.tar.gz -C "$RUNNER_TOOL_CACHE/xmrts"
        # Integrity: the archive ships SHA256SUMS inside; every extracted
        # file must match before the binary is trusted.
        if [ -f "$RUNNER_TOOL_CACHE/xmrts/SHA256SUMS" ]; then
          (cd "$RUNNER_TOOL_CACHE/xmrts" && shasum -a 256 -c SHA256SUMS)
        else
          echo "::warning::SHA256SUMS missing from xmrts archive: integrity check skipped"
        fi
        echo "$RUNNER_TOOL_CACHE/xmrts" >> "$GITHUB_PATH"

    - name: Stamp files
      id: stamp
      shell: bash
      env:
        XMTS_FILES: ${{ inputs.files }}
        XMTS_NETWORK: ${{ inputs.network }}
        XMTS_DAEMON: ${{ inputs.daemon }}
        XMTS_ENDPOINT: ${{ inputs.wallet-endpoint }}
        XMTS_RPC_USER: ${{ inputs.wallet-username }}
        XMTS_RPC_PASS: ${{ inputs.wallet-password }}
        XMTS_MAX_FEE: ${{ inputs.max-fee }}
        XMTS_NO_WAIT: ${{ inputs.no-wait }}
        XMTS_OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        # Never stamp with a savings wallet: use a dedicated low-value
        # timestamping wallet and a --max-fee cap (see inputs).
        # Point xmrts at the reachable wallet/daemon first: `stamp` reads
        # its endpoint and RPC login from the saved config.
        if [ -n "$XMTS_ENDPOINT" ]; then
          xmrts connect --endpoint "$XMTS_ENDPOINT"
        fi
        if [ -n "$XMTS_DAEMON" ]; then
          xmrts connect --daemon "$XMTS_DAEMON"
        fi
        if [ -n "$XMTS_RPC_USER" ]; then
          if [ -z "$XMTS_RPC_PASS" ]; then
            echo "::error::wallet-username needs wallet-password too" >&2
            exit 1
          fi
          # Pipe the secret so it never lands on argv. The env var is
          # still in this step's environment; prefer IP-allowlisted
          # wallets without login when possible.
          printf '%s' "$XMTS_RPC_PASS" | xmrts connect --username "$XMTS_RPC_USER" --password-stdin --save-auth
        fi
        args=(--json --yes)
        if [ "$XMTS_NO_WAIT" = "true" ]; then args+=(--no-wait); fi
        if [ -n "$XMTS_DAEMON" ]; then args+=(--daemon "$XMTS_DAEMON"); fi
        if [ -n "$XMTS_MAX_FEE" ]; then args+=(--max-fee "$XMTS_MAX_FEE"); fi
        if [ -n "$XMTS_OUT_DIR" ]; then args+=(--out-dir "$XMTS_OUT_DIR"); fi
        if [ "$XMTS_NETWORK" = "stagenet" ]; then args+=(--stagenet); fi
        # shellcheck disable=SC2086
        out="$(xmrts stamp $XMTS_FILES "${args[@]}")"
        echo "$out" | python3 -c '
          import json,sys
          v = json.load(sys.stdin)
          def gh_out(k, val):
              val = "" if val is None else str(val)
              print(f"{k}={val}")
              with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{k}={val}\n")
          gh_out("txid", v.get("txid", ""))
          gh_out("proofs", " ".join(v.get("proofs", [])))
          gh_out("pending", str(v.get("pending", False)).lower())
        '
