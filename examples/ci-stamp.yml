# Timestamp release artifacts with xmrts on every tag.
#
# Prereqs:
# - a dedicated low-value Monero timestamping wallet (NEVER savings),
#   open in a monero-wallet-rpc REACHABLE from the runner (a hosted runner
#   has no local wallet: use a service container, a sidecar host, or a
#   trusted remote wallet). Store its endpoint + RPC login as secrets;
# - a daemon address (local node or trusted remote).
#
# Flow: stamp with --no-wait on release (pending .xmrts proofs keep their
# txid/root), then a scheduled job upgrades the proof files themselves with
# `finalize <proof>` until they anchor. No pending-record handoff needed:
# each .xmrts carries what finalize needs.

name: timestamp-release

on:
  release:
    types: [published]
  # Every 30 min until anchored; each run upgrades what it can and exits.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  stamp:
    # Only stamp on releases; scheduled runs only finalize.
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build artifacts
        run: |
          # ... your build here, e.g. cargo build --release
          mkdir -p dist && shasum -a 256 dist/* > dist/SHA256SUMS

      - name: Timestamp artifacts
        id: stamp
        uses: islemci/xmrts@v1
        with:
          files: "dist/SHA256SUMS"
          version: "0.3.0"
          daemon: ${{ secrets.XMRTS_DAEMON }}
          wallet-endpoint: ${{ secrets.XMRTS_WALLET_ENDPOINT }}
          wallet-username: ${{ secrets.XMRTS_WALLET_USER }}
          wallet-password: ${{ secrets.XMRTS_WALLET_PASS }}
          max-fee: "100000"
          no-wait: "true"
          out-dir: "dist"

      - name: Upload proofs
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-proofs
          path: dist/*.xmrts

  finalize:
    runs-on: ubuntu-22.04
    # Scheduled runs have no `stamp` to need; release runs wait for it.
    if: always() && (github.event_name != 'release' || needs.stamp.result == 'success')
    needs: [stamp]
    steps:
      - uses: actions/checkout@v4
      - name: Install xmrts (verified)
        env:
          XMTS_VERSION: "0.3.0"
        run: |
          set -euo pipefail
          base="https://github.com/islemci/xmrts/releases/download/v$XMTS_VERSION"
          curl -fsSL "$base/xmrts-linux-x86_64.tar.gz" -o /tmp/xmrts.tar.gz
          gh attestation verify /tmp/xmrts.tar.gz --owner islemci
          mkdir -p ~/.local/bin && tar -xzf /tmp/xmrts.tar.gz -C ~/.local/bin
          (cd ~/.local/bin && [ -f SHA256SUMS ] && shasum -a 256 -c SHA256SUMS)
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: timestamp-proofs
          path: dist
      # Proof-only finalize: each pending .xmrts holds its own txid/root,
      # so no pending-record artifact and no original files are needed.
      - name: Finish pending stamps
        run: |
          set -euo pipefail
          shopt -s nullglob
          proofs=(dist/*.xmrts)
          if [ "${#proofs[@]}" -eq 0 ]; then
            echo "No proofs to finalize."
            exit 0
          fi
          for p in "${proofs[@]}"; do
            xmrts finalize "$p" --daemon "${{ secrets.XMRTS_DAEMON }}" || echo "::warning::still pending: $p"
          done
        timeout-minutes: 25
